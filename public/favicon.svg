<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b2b44"/>
      <stop offset="100%" style="stop-color:#1a5a7a"/>
    </linearGradient>
    <linearGradient id="batGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6ca"/>
      <stop offset="100%" style="stop-color:#d4a76a"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="20" fill="url(#bgGrad)"/>

  <!-- Cricket Bat -->
  <g transform="translate(50, 50) rotate(-30) translate(-50, -50)">
    <!-- Bat handle -->
    <rect x="44" y="15" width="12" height="25" rx="3" fill="#8B7355"/>
    <rect x="45" y="12" width="10" height="6" rx="2" fill="#6B5340"/>
    <!-- Bat grip lines -->
    <line x1="45" y1="20" x2="55" y2="20" stroke="#6B5340" stroke-width="1"/>
    <line x1="45" y1="24" x2="55" y2="24" stroke="#6B5340" stroke-width="1"/>
    <line x1="45" y1="28" x2="55" y2="28" stroke="#6B5340" stroke-width="1"/>
    <line x1="45" y1="32" x2="55" y2="32" stroke="#6B5340" stroke-width="1"/>
    <line x1="45" y1="36" x2="55" y2="36" stroke="#6B5340" stroke-width="1"/>

    <!-- Bat blade -->
    <path d="M38,40 L36,55 C34,70 32,78 35,82 L37,85 L63,85 L65,82 C68,78 66,70 64,55 L62,40 Z"
          fill="url(#batGrad)" stroke="#c49a6c" stroke-width="1"/>
    <!-- Bat spine -->
    <line x1="50" y1="40" x2="50" y2="80" stroke="#c49a6c" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Cricket Ball -->
  <circle cx="68" cy="28" r="10" fill="#cc3333"/>
  <path d="M62,25 C66,22 70,22 74,25" stroke="white" stroke-width="1.5" fill="none"/>
  <path d="M62,31 C66,34 70,34 74,31" stroke="white" stroke-width="1.5" fill="none"/>
  <line x1="62" y1="23" x2="62" y2="33" stroke="white" stroke-width="1.5"/>
  <line x1="74" y1="23" x2="74" y2="33" stroke="white" stroke-width="1.5"/>

  <!-- Small "i" for ID -->
  <text x="50" y="94" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f5e6ca" text-anchor="middle">ID</text>
</svg>
